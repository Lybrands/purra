name: Publish Python packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: purra
            path: .
          - package: purra-openai
            path: integrations/openai/python
          - package: purra-anthropic
            path: integrations/anthropic/python
          - package: purra-compaction
            path: integrations/compaction/python
          - package: purra-interaction
            path: integrations/interaction/python
          - package: purra-sqlite
            path: integrations/sqlite/python
          - package: purra-mem0
            path: integrations/mem0/python
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/check_release_version.py "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir dist "$PACKAGE_PATH"
        env:
          PACKAGE_PATH: ${{ matrix.path }}
      - name: Verify installed wheel
        if: matrix.package == 'purra'
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ matrix.package }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [purra, purra-openai, purra-anthropic, purra-compaction, purra-interaction, purra-sqlite, purra-mem0]
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
