name: Publish Python packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      component:
        description: Component to publish (select one for first-time project creation)
        required: true
        default: all
        type: choice
        options: [all, core, openai, anthropic, compaction, interaction, sqlite, mem0, mcp]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component && inputs.component != 'all' && format('["{0}"]', inputs.component) || '["core","openai","anthropic","compaction","interaction","sqlite","mem0","mcp"]') }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/check_release_version.py "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir dist "$PACKAGE_PATH"
        env:
          PACKAGE_PATH: ${{ matrix.component == 'core' && '.' || format('integrations/{0}/python', matrix.component) }}
      - name: Verify installed wheel
        if: matrix.component == 'core'
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ matrix.component }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component && inputs.component != 'all' && format('["{0}"]', inputs.component) || '["core","openai","anthropic","compaction","interaction","sqlite","mem0","mcp"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.component == 'core' && 'purra' || format('purra-{0}', matrix.component) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-${{ matrix.component }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
