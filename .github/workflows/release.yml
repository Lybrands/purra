name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/check_release_version.py "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/purra
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
