name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: matrix.python-version == '3.11'
        run: python scripts/check_release_version.py
      - run: python -m pip install ".[test]" build
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
      - run: python examples/python/quickstart.py
      - run: python examples/python/planner_streaming.py
      - run: git diff --check
      - if: matrix.python-version == '3.11'
        run: python -m build --sdist --wheel
      - name: Verify installed wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: git diff --check
        working-directory: .

  mem0-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install . "./integrations/mem0/python[test,managed]" build
      - run: python -m pytest
        working-directory: integrations/mem0/python
      - run: python integrations/mem0/python/scripts/check_sdk.py
      - run: python -m build --wheel integrations/mem0/python

  mem0-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: integrations/mem0/typescript/package-lock.json
      - run: npm ci && npm run build
        working-directory: typescript
      - run: npm ci && npm run check && npm run test:sdk && npm pack --dry-run
        working-directory: integrations/mem0/typescript

  optional-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [openai, anthropic, compaction, interaction, sqlite]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install ".[test]" "./integrations/${{ matrix.component }}/python" build
      - if: matrix.component == 'interaction'
        run: python -m pip install ./integrations/sqlite/python
      - run: python -m pytest
        working-directory: integrations/${{ matrix.component }}/python
      - run: python -m build --wheel integrations/${{ matrix.component }}/python
      - run: npm ci && npm run build
        working-directory: typescript
      - if: matrix.component == 'interaction'
        run: npm ci && npm run build
        working-directory: integrations/sqlite/typescript
      - run: npm ci && npm run check && npm pack --dry-run
        working-directory: integrations/${{ matrix.component }}/typescript

  package-installers:
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: npm
            install-command: npm install --ignore-scripts
            runtime-command: node
          - installer: pnpm
            install-command: pnpm add --ignore-scripts
            runtime-command: node
          - installer: yarn
            install-command: yarn add --mode=skip-build
            runtime-command: yarn node
          - installer: bun
            install-command: bun add --ignore-scripts
            runtime-command: bun
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - if: matrix.installer == 'pnpm'
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.19.0
      - if: matrix.installer == 'yarn'
        run: |
          corepack enable yarn
          corepack install --global yarn@4.9.2
      - if: matrix.installer == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: npm ci
        working-directory: typescript
      - name: Pack the exact install candidate
        id: pack
        run: |
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
        working-directory: typescript
      - name: Prepare a clean external consumer
        run: cp -R typescript/test/installed-consumer "$RUNNER_TEMP/purra-consumer"
      - name: Install with ${{ matrix.installer }}
        run: ${{ matrix.install-command }} "${{ steps.pack.outputs.tarball }}"
        working-directory: ${{ runner.temp }}/purra-consumer
      - name: Run installed artifact with ${{ matrix.runtime-command }}
        run: ${{ matrix.runtime-command }} smoke.mjs
        working-directory: ${{ runner.temp }}/purra-consumer
      - name: Compile strict installed-package consumer
        if: matrix.installer == 'npm'
        run: |
          "${{ github.workspace }}/typescript/node_modules/.bin/tsc" -p tsconfig.json
        working-directory: ${{ runner.temp }}/purra-consumer
