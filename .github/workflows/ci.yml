name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[test]" build
      - run: python -m pytest
      - run: python -m build --sdist --wheel
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py
