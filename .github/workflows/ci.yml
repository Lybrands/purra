name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: matrix.python-version == '3.11'
        run: python scripts/check_release_version.py
      - run: python -m pip install ".[test]" build
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
      - run: python examples/python/quickstart.py
      - run: python examples/python/planner_streaming.py
      - run: python examples/python/parallel_tools.py
      - run: python examples/python/integration_check.py
      - run: python examples/python/structured_task.py
      - run: git diff --check
      - if: matrix.python-version == '3.11'
        run: python -m build --sdist --wheel
      - name: Verify installed wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m venv "$RUNNER_TEMP/purra-smoke"
          "$RUNNER_TEMP/purra-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/purra-smoke/bin/python" tests/installed_distribution_smoke.py

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: git diff --check
        working-directory: .

  mem0-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install . "./integrations/mem0/python[test]" build
      - run: python -m pytest
        working-directory: integrations/mem0/python
      - name: Verify the pinned SDK transformation
        run: python integrations/mem0/python/scripts/sync_sdk.py "$(python -c 'import importlib.util; from pathlib import Path; print(Path(importlib.util.find_spec("mem0").origin).parent / "memory/main.py")')" --check
      - run: python integrations/mem0/python/scripts/check_sdk.py
      - run: python integrations/mem0/python/scripts/check_native_sdk.py
      - name: Verify installed native Memory wheels
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/mem0-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/mem0-wheels" integrations/mem0/python
          python -m venv "$RUNNER_TEMP/mem0-consumer"
          "$RUNNER_TEMP/mem0-consumer/bin/python" -m pip install "$RUNNER_TEMP"/mem0-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mem0-consumer/bin/python" -c 'from importlib.metadata import distributions; assert not any("langchain" in d.metadata["Name"].lower() or d.metadata["Name"].lower() == "langsmith" for d in distributions())'
          "$RUNNER_TEMP/mem0-consumer/bin/python" "$GITHUB_WORKSPACE/integrations/mem0/python/scripts/check_sdk.py"
          "$RUNNER_TEMP/mem0-consumer/bin/python" "$GITHUB_WORKSPACE/integrations/mem0/python/scripts/check_native_sdk.py"

  mem0-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: integrations/mem0/typescript/package-lock.json
      - run: npm ci && npm run build
        working-directory: typescript
      - run: npm ci && npm run check && npm run test:sdk && npm pack --dry-run
        working-directory: integrations/mem0/typescript
      - name: Verify installed native Memory tarballs and public types
        run: |
          mkdir -p "$RUNNER_TEMP/mem0-node/consumer/scripts"
          (cd typescript && npm pack --pack-destination "$RUNNER_TEMP/mem0-node")
          (cd integrations/mem0/typescript && npm pack --pack-destination "$RUNNER_TEMP/mem0-node")
          cp integrations/mem0/typescript/scripts/*.mjs "$RUNNER_TEMP/mem0-node/consumer/scripts/"
          cp integrations/mem0/typescript/test/{consumer.ts,tsconfig.json} "$RUNNER_TEMP/mem0-node/consumer/"
          cp -R integrations/mem0/fixtures "$RUNNER_TEMP/mem0-node/fixtures"
          cd "$RUNNER_TEMP/mem0-node/consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --omit=dev --omit=optional ../*.tgz
          node --input-type=module -e 'import {createRequire} from "node:module"; const require=createRequire(import.meta.url); for(const name of ["@langchain/core","langchain","langsmith","mem0ai"]) { try { require.resolve(name); throw new Error("unexpected dependency: " + name); } catch(e) { if(e.code !== "MODULE_NOT_FOUND") throw e; } }'
          node --experimental-loader ./scripts/deny-langchain.mjs scripts/check-sdk.mjs
          node --experimental-loader ./scripts/deny-langchain.mjs scripts/check-native-sdk.mjs
          "$GITHUB_WORKSPACE/typescript/node_modules/.bin/tsc" -p tsconfig.json

  optional-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [openai, anthropic, compaction, interaction, sqlite, mcp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install ".[test]" "./integrations/${{ matrix.component }}/python" build
      - if: matrix.component == 'interaction'
        run: python -m pip install ./integrations/sqlite/python
      - run: python -m pytest
        working-directory: integrations/${{ matrix.component }}/python
      - run: python -m build --wheel integrations/${{ matrix.component }}/python
      - run: npm ci && npm run build
        working-directory: typescript
      - if: matrix.component == 'interaction'
        run: npm ci && npm run build
        working-directory: integrations/sqlite/typescript
      - run: npm ci && npm run check && npm pack --dry-run
        working-directory: integrations/${{ matrix.component }}/typescript
      - name: Verify installed MCP wheel with a host-owned stdio server
        if: matrix.component == 'mcp'
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/mcp-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/mcp-wheels" integrations/mcp/python
          python -m venv "$RUNNER_TEMP/mcp-consumer"
          "$RUNNER_TEMP/mcp-consumer/bin/python" -m pip install "$RUNNER_TEMP"/mcp-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-consumer/bin/python" -I "$GITHUB_WORKSPACE/integrations/mcp/python/scripts/check_installed.py"
      - name: Verify installed MCP tarballs, public types and stdio server
        if: matrix.component == 'mcp'
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-node/consumer"
          (cd typescript && npm pack --pack-destination "$RUNNER_TEMP/mcp-node")
          (cd integrations/mcp/typescript && npm pack --pack-destination "$RUNNER_TEMP/mcp-node")
          cp integrations/mcp/typescript/scripts/check-installed.mjs "$RUNNER_TEMP/mcp-node/consumer/"
          cp integrations/mcp/typescript/test/{consumer.ts,tsconfig.json} "$RUNNER_TEMP/mcp-node/consumer/"
          cd "$RUNNER_TEMP/mcp-node/consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts ../*.tgz
          node check-installed.mjs
          "$GITHUB_WORKSPACE/typescript/node_modules/.bin/tsc" -p tsconfig.json

  package-installers:
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: npm
            install-command: npm install --ignore-scripts
            runtime-command: node
          - installer: pnpm
            install-command: pnpm add --ignore-scripts
            runtime-command: node
          - installer: yarn
            install-command: yarn add --mode=skip-build
            runtime-command: yarn node
          - installer: bun
            install-command: bun add --ignore-scripts
            runtime-command: bun
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - if: matrix.installer == 'pnpm'
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.19.0
      - if: matrix.installer == 'yarn'
        run: |
          corepack enable yarn
          corepack install --global yarn@4.9.2
      - if: matrix.installer == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: npm ci
        working-directory: typescript
      - name: Pack the exact install candidate
        id: pack
        run: |
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
        working-directory: typescript
      - name: Prepare a clean external consumer
        run: cp -R typescript/test/installed-consumer "$RUNNER_TEMP/purra-consumer"
      - name: Install with ${{ matrix.installer }}
        run: ${{ matrix.install-command }} "${{ steps.pack.outputs.tarball }}"
        working-directory: ${{ runner.temp }}/purra-consumer
      - name: Run installed artifact with ${{ matrix.runtime-command }}
        run: ${{ matrix.runtime-command }} smoke.mjs
        working-directory: ${{ runner.temp }}/purra-consumer
      - name: Compile strict installed-package consumer
        if: matrix.installer == 'npm'
        run: |
          "${{ github.workspace }}/typescript/node_modules/.bin/tsc" -p tsconfig.json
        working-directory: ${{ runner.temp }}/purra-consumer
