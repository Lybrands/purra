[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "purra-sqlite"
version = "0.5.1"
description = "SQLite persistence for PurrA"
requires-python = ">=3.11"
dependencies = ["purra==0.5.1"]
readme = "README.md"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../../src"]
testpaths = ["tests"]
addopts = "-ra -q"
