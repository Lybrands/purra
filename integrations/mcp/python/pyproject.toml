[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "purra-mcp"
version = "1.0.0"
description = "Host-owned, read-only MCP tools for PurrA"
requires-python = ">=3.11"
dependencies = ["purra==1.0.0", "mcp==1.29.1"]
readme = "README.md"
license = "MIT"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "../../../src"]
testpaths = ["tests"]
addopts = "-ra -q"
